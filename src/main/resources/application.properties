spring.application.name=taskmaster

spring.datasource.url=jdbc:mariadb://localhost:3306/taskmaster?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:taskmaster}
spring.datasource.password=${DB_PASSWORD:taskmaster123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
